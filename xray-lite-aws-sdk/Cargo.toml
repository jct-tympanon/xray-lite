[package]
name = "xray-lite-aws-sdk"
version = "0.0.6"
authors = ["Kikuo Emoto <kemoto@codemonger.io>"]
edition = "2021"
description = "xray-lite extension for AWS SDK for Rust"
license = "MIT"
keywords = ["aws", "x-ray", "aws-sdk", "tracing"]
readme = "./README.md"
documentation = "https://docs.rs/xray-lite-aws-sdk"
homepage = "https://github.com/codemonger-io/xray-lite/tree/main/xray-lite-aws-sdk"
repository = "https://github.com/codemonger-io/xray-lite"
categories = ["development-tools::debugging", "development-tools::profiling"]

[lib]
name = "xray_lite_aws_sdk"

[features]
classify = [ "dep:url" ]

[dependencies]
aws-smithy-runtime-api = { version = "1.11.6", features = ["client"] }
aws-smithy-types = "1.4.7"
aws-types = "1.3.14"
xray-lite = { path = "../xray-lite", version = "0.0.10" }

# runtime plugin dependencies
url = { version = "2.5.4", optional = true }

[dev-dependencies]
aws-config = "1.8.15"
aws-sdk-dynamodb = "1.110.0"
aws-sdk-s3 = "1.127.0"
aws-smithy-runtime = { version = "1.10.3", features = [ "test-util" ] }
http = "1.4.0"
serde = { workspace = true, features = [ "derive" ]}
serde_json = { workspace = true }
serial_test = "3.2.0"
tokio = { version = "1.50.0", features = [ "rt", "macros" ] }
